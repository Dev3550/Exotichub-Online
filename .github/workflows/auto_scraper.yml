name: ExoticHub Cloud Auto-Scraper

on:
  schedule:
    # Run in the cloud automatically every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows 1-click manual trigger from GitHub Actions tab

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Cloud Step Search Scraper (Advancing Pages 1 to 926)
        run: node --max-old-space-size=4096 scrape_step_search.js

      - name: Regenerate Google Sitemap
        run: node generate_sitemap.js

      - name: Regenerate Google Video Sitemap
        run: node generate_video_sitemap.js

      - name: Sync URLs to Index
        run: |
          node -e "
            const fs = require('fs');
            const sitemap = fs.readFileSync('sitemap.xml', 'utf8');
            const urls = [...sitemap.matchAll(/<loc>(.*?)<\/loc>/g)].map(m => m[1]);
            fs.writeFileSync('urls_to_index.txt', urls.join('\n') + '\n', 'utf8');
          "

      - name: Commit and Push Updated Catalog & Sitemaps to GitHub & Cloudflare
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sample_videos.json step_search_checkpoint.json sitemap.xml video-sitemap.xml urls_to_index.txt || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(cloud-scraper): auto-scrape /search/step & update sitemaps" && git push origin main)
